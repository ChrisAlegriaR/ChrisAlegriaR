name: Actualizar Tarjetas del README

on:
  schedule:
    - cron: "0 0 * * *" # Se ejecuta automáticamente todos los días a la medianoche
  workflow_dispatch: # Te permite activar el robot manualmente cuando quieras

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Permiso para escribir en el repositorio
      actions: write    # Permiso para interactuar con las acciones

    steps:
      # Usamos v4 pero nos aseguramos de jalar los parches más recientes
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Descargamos las tarjetas usando curl directamente, saltando las acciones viejas de Node 20
      - name: Generar tarjetas de estadísticas y lenguajes
        run: |
          mkdir -p profile
          # Tarjeta de Estadísticas
          curl -s "https://vercel.app" -o profile/stats.svg
          
          # Tarjeta de Lenguajes
          curl -s "https://vercel.app" -o profile/top-langs.svg

      - name: Generar tarjeta de racha (Streak)
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=ChrisAlegriaR&theme=tokyonight-duo&hide_border=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar imágenes en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add profile/*.svg
          
          # Si no hay cambios en las tarjetas, el script continúa sin fallar
          git commit -m "Update README cards [skip ci]" || exit 0
          
          # Trae cualquier cambio externo primero para evitar el '! [rejected]'
          git pull --rebase origin main
          
          git push
